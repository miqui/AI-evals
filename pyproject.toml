[project]
name = "ai-evals"
version = "0.1.0"
description = "All AI evals concerns and topics, organized by subdirectory."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "braintrust>=0.16.0",
    "autoevals>=0.3.0",
]

[project.optional-dependencies]
llm = [
    "inspect-ai>=0.3.0",
    "langfuse>=3.0.0",
]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.setuptools]
packages = []
